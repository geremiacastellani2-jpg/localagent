<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maggiordomo Locale</title>
<style>
  :root{
    --bg:#f5f7f4; --surface:#ffffff; --surface-2:#eef1ec; --ink:#16211f;
    --muted:#5b6a65; --border:#d7ddd4; --accent:#0d7b6a; --accent-strong:#0a5e51;
    --accent-tint:#e2f1ee; --warn:#a9631a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c1214; --surface:#121a1c; --surface-2:#16211f; --ink:#e8efeb;
      --muted:#93a29d; --border:#263133; --accent:#35c9ac; --accent-strong:#57d7bd;
      --accent-tint:#123029; --warn:#e0a24a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:.75rem; padding:.8rem 1.1rem;
    border-bottom:1px solid var(--border); background:var(--surface);
  }
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  header h1{font-size:1rem;margin:0;font-weight:650;letter-spacing:-.01em}
  header .status{
    margin-left:auto; font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--muted); background:var(--surface-2); border:1px solid var(--border);
    padding:.25rem .55rem; border-radius:999px;
  }
  header select{
    font:500 .72rem ui-monospace,Menlo,monospace; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:.25rem .4rem; cursor:pointer;
  }
  header a.diag{font:.7rem ui-monospace,monospace; color:var(--muted); text-decoration:none;
    border:1px solid var(--border); border-radius:8px; padding:.25rem .5rem}
  header button.reset{
    background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:.3rem .55rem;font-size:.75rem;cursor:pointer;
  }
  main{flex:1; overflow-y:auto; padding:1.2rem clamp(.8rem,4vw,2rem)}
  .thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:.7rem}
  .msg{padding:.7rem .95rem;border-radius:14px;line-height:1.5;white-space:pre-wrap;
    max-width:82%;font-size:.97rem;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--accent-tint);border:1px solid var(--accent);
    color:var(--ink);border-bottom-right-radius:5px}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);
    border-bottom-left-radius:5px}
  .msg.bot.thinking{color:var(--muted);font-style:italic}
  .msg.note{align-self:stretch;max-width:100%;background:var(--accent-tint);
    border:1px solid var(--accent);border-left-width:4px;color:var(--ink);font-size:.92rem}
  .msg .img{display:block;margin-top:.5rem;border-radius:8px;max-width:180px;border:1px solid var(--border)}
  .hint{max-width:760px;margin:0 auto 1rem;color:var(--muted);font-size:.85rem;text-align:center}

  footer{border-top:1px solid var(--border);background:var(--surface);padding:.7rem clamp(.8rem,4vw,2rem)}
  .composer{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:.55rem}
  .cam{display:none;align-items:center;gap:.8rem}
  .cam.on{display:flex}
  .camwrap{position:relative;width:150px;height:112px;flex:0 0 auto}
  .camwrap video,.camwrap canvas{
    position:absolute;inset:0;width:150px;height:112px;border-radius:10px;transform:scaleX(-1);
  }
  .camwrap video{object-fit:cover;border:1px solid var(--border);background:#000}
  .camwrap canvas{pointer-events:none}
  .caminfo{font-size:.8rem;color:var(--muted);line-height:1.4}
  .caminfo .live{color:var(--accent-strong);font-weight:600}
  .caminfo #liveObjs,.caminfo #liveFaces{font-family:ui-monospace,Menlo,monospace;font-size:.74rem}
  .caminfo button.enroll{
    margin-top:.35rem;font-size:.72rem;border:1px solid var(--border);background:var(--surface-2);
    color:var(--ink);border-radius:7px;padding:.2rem .5rem;cursor:pointer;
  }
  .row{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
  textarea{
    flex:1;resize:none;min-height:44px;max-height:160px;padding:.7rem .8rem;
    border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);
    font:inherit;font-size:.97rem;line-height:1.4;min-width:120px;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:0}
  button.icon{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:12px;height:44px;min-width:44px;font-size:1.1rem;cursor:pointer;
  }
  button.icon.active{background:var(--accent-tint);border-color:var(--accent)}
  button.icon.rec{background:#c0392b;border-color:#c0392b;color:#fff}
  button.send{
    border:none;background:var(--accent);color:#fff;border-radius:12px;height:44px;
    padding:0 1.1rem;font-weight:650;cursor:pointer;font-size:.95rem;
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  @media (prefers-color-scheme:dark){button.send{color:#06231d}}
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Maggiordomo</h1>
    <span class="status" id="status">connessione…</span>
    <select id="tierSel" title="Dove mandare la chat">
      <option value="auto">auto</option>
      <option value="local">locale</option>
      <option value="cloud">cloud</option>
    </select>
    <a class="diag" href="/diag" target="_blank" title="Diagnostica configurazione">diag</a>
    <button class="reset" id="reset" title="Nuova conversazione">azzera</button>
  </header>

  <main>
    <div class="hint" id="hint">Parlagli in italiano — a voce (🎤) o scritto. Con 📷 vede dal vivo e riconosce oggetti e volti registrati.</div>
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div class="composer">
      <div class="cam" id="cam">
        <div class="camwrap">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="caminfo">
          <div><span class="live">● LIVE</span> — vede il momento presente.</div>
          <div id="liveObjs">avvio riconoscimento…</div>
          <div id="liveFaces"></div>
          <button class="enroll" id="enrollBtn">＋ registra volto</button>
        </div>
      </div>
      <div class="row">
        <button class="icon" id="camBtn" title="Attiva/disattiva camera">📷</button>
        <button class="icon" id="micBtn" title="Parla" disabled>🎤</button>
        <button class="icon" id="ttsBtn" title="Risposte a voce">🔊</button>
        <button class="icon" id="calBtn" title="Agenda di oggi">📅</button>
        <button class="icon" id="eyeBtn" title="Cosa vedi?" disabled>👁️</button>
        <textarea id="input" placeholder="Scrivi un messaggio…" rows="1"></textarea>
        <button class="send" id="send">Invia</button>
      </div>
    </div>
  </footer>

<!-- face-api PRIMA di tfjs: ha il suo TensorFlow incorporato e i due runtime
     non devono pestarsi i piedi (il tf globale per coco-ssd arriva dopo) -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const SESSION = "default";
const FACE_MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";
const $ = id => document.getElementById(id);
const thread=$("thread"), input=$("input"), sendBtn=$("send"), camBtn=$("camBtn"),
      eyeBtn=$("eyeBtn"), micBtn=$("micBtn"), ttsBtn=$("ttsBtn"), cam=$("cam"),
      video=$("video"), overlay=$("overlay"), liveObjsEl=$("liveObjs"),
      liveFacesEl=$("liveFaces"), statusEl=$("status");

let stream=null, detector=null, faceReady=false, faceMatcher=null;
let liveObjects=[], liveFaces=[], lastObjs=[], lastFaces=[];
let detectTimer=null, faceTimer=null, streamTimer=null;
let ttsOn=false, notifCursor=0;

// ---------- stato / util ----------
async function loadStatus(){
  try{ const j=await (await fetch("/health")).json(); statusEl.textContent=`${j.tier} · ${j.model}`; }
  catch{ statusEl.textContent="offline"; }
}
loadStatus();

function addMsg(role, text, imgDataUrl, cls){
  const el=document.createElement("div");
  el.className="msg "+(role==="user"?"user":"bot")+(cls?(" "+cls):"");
  el.textContent=text;
  if(imgDataUrl){ const img=document.createElement("img"); img.className="img"; img.src=imgDataUrl; el.appendChild(img); }
  thread.appendChild(el); el.scrollIntoView({behavior:"smooth",block:"end"});
  return el;
}

function captureFrame(){
  if(!stream||video.videoWidth===0) return null;
  const scale=Math.min(1,640/video.videoWidth);
  const c=document.createElement("canvas");
  c.width=Math.round(video.videoWidth*scale); c.height=Math.round(video.videoHeight*scale);
  c.getContext("2d").drawImage(video,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.7);
}

// ---------- disegno overlay (oggetti + volti) ----------
function redraw(){
  const ctx=overlay.getContext("2d");
  overlay.width=video.videoWidth||150; overlay.height=video.videoHeight||112;
  ctx.clearRect(0,0,overlay.width,overlay.height);
  ctx.lineWidth=Math.max(2,overlay.width/160);
  ctx.font=`${Math.max(12,overlay.width/26)}px -apple-system,sans-serif`;
  ctx.strokeStyle="#35c9ac"; ctx.fillStyle="#35c9ac";
  lastObjs.forEach(p=>{ const[x,y,w,h]=p.bbox; ctx.strokeRect(x,y,w,h); ctx.fillText(p.class,x+3,y>14?y-4:y+14); });
  ctx.strokeStyle="#e0a24a"; ctx.fillStyle="#e0a24a";
  lastFaces.forEach(f=>{ const b=f.box; ctx.strokeRect(b.x,b.y,b.width,b.height); ctx.fillText(f.label,b.x+3,b.y>14?b.y-4:b.y+14); });
}

// ---------- rilevamento oggetti ----------
async function ensureDetector(){
  if(detector) return;
  if(!window.cocoSsd){
    liveObjsEl.textContent="librerie visione non caricate: serve internet, poi ricarica (⌘⇧R)";
    return;
  }
  try{
    liveObjsEl.textContent="carico il modello…";
    // base mobilenet_v2: più accurata della variante lite di default
    detector=await cocoSsd.load({base:"mobilenet_v2"});
  }catch{
    try{ detector=await cocoSsd.load(); }  // fallback alla variante lite
    catch{ liveObjsEl.textContent="modelli visione non scaricabili: controlla la connessione e ricarica"; }
  }
}
async function detectLoop(){
  if(!stream) return;
  if(detector&&video.videoWidth){
    try{
      const preds=(await detector.detect(video,20,0.35)).filter(p=>p.score>0.4);
      lastObjs=preds; liveObjects=preds.map(p=>p.class); redraw();
      const c={}; liveObjects.forEach(o=>c[o]=(c[o]||0)+1);
      const s=Object.entries(c).map(([k,v])=>v>1?`${k}×${v}`:k).join(", ");
      liveObjsEl.textContent=s?("oggetti: "+s):"nessun oggetto";
    }catch{}
  }
  detectTimer=setTimeout(detectLoop,300);
}

// ---------- riconoscimento volti (face-api.js) ----------
function loadEnrolled(){ try{ return JSON.parse(localStorage.getItem("faces")||"[]"); }catch{ return []; } }
function saveEnrolled(list){ try{ localStorage.setItem("faces",JSON.stringify(list)); }catch{} }
function rebuildMatcher(){
  if(!window.faceapi) return;
  const list=loadEnrolled();
  if(!list.length){ faceMatcher=null; return; }
  const labeled=list.map(e=>new faceapi.LabeledFaceDescriptors(e.name,[new Float32Array(e.descriptor)]));
  faceMatcher=new faceapi.FaceMatcher(labeled,0.55);
}
const FACE_OPTS=()=>new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.3});
let faceErrShown=false;
function faceFail(where,e){
  const msg=(e&&(e.message||e))+"";
  liveFacesEl.textContent="volti: errore — "+msg.slice(0,120);
  if(!faceErrShown){ faceErrShown=true; addMsg("bot","⚠️ Riconoscimento volti ("+where+"): "+msg); }
}
async function ensureFace(){
  if(faceReady) return;
  if(!window.faceapi){
    liveFacesEl.textContent="libreria volti non caricata: serve internet, poi ricarica (⌘⇧R)";
    return;
  }
  try{
    liveFacesEl.textContent="carico riconoscimento volti…";
    // inizializza esplicitamente il backend del tf incorporato in face-api
    try{ if(faceapi.tf?.setBackend){ await faceapi.tf.setBackend("webgl"); await faceapi.tf.ready(); } }
    catch{ try{ await faceapi.tf.setBackend("cpu"); await faceapi.tf.ready(); }catch{} }
    await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS);
    await faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS);
    await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS);
    faceReady=true; rebuildMatcher(); liveFacesEl.textContent="volti: pronto";
  }catch(e){ faceFail("caricamento modelli",e); }
}
async function faceLoop(){
  if(!stream) return;
  if(faceReady&&video.videoWidth){
    try{
      const dets=await faceapi.detectAllFaces(video,FACE_OPTS())
        .withFaceLandmarks().withFaceDescriptors();
      lastFaces=[]; liveFaces=[];
      dets.forEach(d=>{
        const label=faceMatcher?faceMatcher.findBestMatch(d.descriptor).label:"volto";
        const name=(label&&label!=="unknown")?label:"sconosciuto";
        lastFaces.push({box:d.detection.box,label:name});
        if(name!=="sconosciuto"&&name!=="volto") liveFaces.push(name);
      });
      redraw();
      liveFacesEl.textContent=lastFaces.length?("volti: "+lastFaces.map(f=>f.label).join(", ")):"volti: nessuno in vista";
    }catch(e){ faceFail("rilevamento",e); }
  }
  faceTimer=setTimeout(faceLoop,1300);
}
async function enrollFace(){
  try{
    if(!stream){ addMsg("bot","Attiva prima la camera (📷)."); return; }
    await ensureFace();
    if(!faceReady){ addMsg("bot","Riconoscimento volti non disponibile — vedi il messaggio d'errore sopra."); return; }
    addMsg("bot","Cerco il volto, guarda la camera…");
    const det=await faceapi.detectSingleFace(video,FACE_OPTS())
      .withFaceLandmarks().withFaceDescriptor();
    if(!det){ addMsg("bot","Non vedo un volto nitido: avvicinati, illumina la scena e riprova."); return; }
    const name=prompt("Nome della persona da registrare:");
    if(!name) return;
    const list=loadEnrolled();
    list.push({name:name.trim(),descriptor:Array.from(det.descriptor)});
    saveEnrolled(list); rebuildMatcher();
    addMsg("bot",`Volto di ${name.trim()} registrato ✓ (resta sul tuo browser).`);
  }catch(e){ faceFail("registrazione",e); }
}

// ---------- feed verso il backend ----------
async function pushFrame(){
  const frame=captureFrame(); if(!frame) return;
  try{ await fetch("/frame",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session:SESSION,frame,objects:liveObjects,faces:liveFaces})}); }catch{}
}

async function toggleCam(){
  if(stream){
    clearTimeout(detectTimer); clearTimeout(faceTimer); clearInterval(streamTimer);
    stream.getTracks().forEach(t=>t.stop()); stream=null;
    cam.classList.remove("on"); camBtn.classList.remove("active"); eyeBtn.disabled=true;
    liveObjects=[]; liveFaces=[]; lastObjs=[]; lastFaces=[];
    fetch("/frame",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:SESSION,frame:null,objects:[],faces:[]})});
    return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=stream; cam.classList.add("on"); camBtn.classList.add("active"); eyeBtn.disabled=false;
    await ensureDetector(); detectLoop();
    ensureFace().then(()=>faceLoop());
    streamTimer=setInterval(pushFrame,1200);
  }catch(e){ addMsg("bot","Non riesco ad accedere alla camera: "+e.message); }
}

// ---------- voce in ingresso (Web Speech) ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, recognizing=false;
micBtn.disabled=false;   // sempre cliccabile: se non supportato, spiega perché
if(SR){
  recog=new SR(); recog.lang="it-IT"; recog.interimResults=false; recog.maxAlternatives=1;
  recog.onresult=e=>{ const t=e.results[0][0].transcript; send(t); };
  recog.onend=()=>{ recognizing=false; micBtn.classList.remove("rec"); };
  recog.onerror=e=>{
    recognizing=false; micBtn.classList.remove("rec");
    const map={
      "not-allowed":"permesso microfono negato. Consenti il microfono dal lucchetto nella barra indirizzi, e in Impostazioni di Sistema → Privacy e Sicurezza → Microfono abilita il browser.",
      "service-not-allowed":"il servizio di riconoscimento vocale non è disponibile in questo browser: usa Google Chrome.",
      "network":"il riconoscimento vocale richiede la connessione a internet.",
      "audio-capture":"nessun microfono rilevato.",
      "no-speech":""  // silenzio: nessun messaggio
    };
    const msg=(e.error in map)?map[e.error]:("errore: "+e.error);
    if(msg) addMsg("bot","🎤 "+msg);
  };
}
function toggleMic(){
  if(!recog){
    addMsg("bot","🎤 Il riconoscimento vocale non è supportato da questo browser: usa Google Chrome. (La lettura ad alta voce 🔊 funziona comunque.)");
    return;
  }
  if(recognizing){ recog.stop(); return; }
  try{ recog.start(); recognizing=true; micBtn.classList.add("rec"); }catch{}
}

// ---------- voce in uscita (TTS) ----------
function speak(text){
  if(!ttsOn||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text); u.lang="it-IT";
  window.speechSynthesis.speak(u);
}
function toggleTts(){ ttsOn=!ttsOn; ttsBtn.classList.toggle("active",ttsOn); if(!ttsOn) window.speechSynthesis?.cancel(); }

// ---------- notifiche proattive (polling) ----------
async function pollNotifications(){
  try{
    const j=await (await fetch("/notifications?cursor="+notifCursor)).json();
    notifCursor=j.cursor||notifCursor;
    (j.items||[]).forEach(n=>{ addMsg("bot",n.text,null,"note"); speak(n.text); });
  }catch{}
}
setInterval(pollNotifications,5000);

// ---------- invio ----------
async function send(text){
  const message=(text??input.value).trim(); if(!message) return;
  const frame=captureFrame();
  addMsg("user",message,frame);
  input.value=""; input.style.height="auto"; sendBtn.disabled=true;
  const thinking=addMsg("bot","sta pensando…"); thinking.classList.add("thinking");
  try{
    const tier=document.getElementById("tierSel").value;
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:SESSION,message,frame,objects:liveObjects,
        tier:(tier==="auto"?null:tier)})});
    const j=await r.json();
    thinking.classList.remove("thinking"); thinking.textContent=j.reply||"(nessuna risposta)";
    if(j.tier&&j.model) statusEl.textContent=`${j.tier} · ${j.model}`;
    speak(j.reply||"");
  }catch(e){ thinking.classList.remove("thinking"); thinking.textContent="Errore di rete: "+e.message; }
  finally{ sendBtn.disabled=false; input.focus(); }
}

sendBtn.addEventListener("click",()=>send());
eyeBtn.addEventListener("click",()=>send("Cosa vedi in questo momento?"));
$("calBtn").addEventListener("click",()=>send("Cosa ho in agenda oggi?"));
camBtn.addEventListener("click",toggleCam);
micBtn.addEventListener("click",toggleMic);
ttsBtn.addEventListener("click",toggleTts);
$("enrollBtn").addEventListener("click",enrollFace);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});
input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(160,input.scrollHeight)+"px"; });
$("reset").addEventListener("click",async()=>{ await fetch("/reset?session="+SESSION,{method:"POST"}); thread.innerHTML=""; });
</script>
</body>
</html>
